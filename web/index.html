<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>OpenCode Session Editor</title>
<style>
:root{color-scheme:dark;--bg:#0d1016;--panel:#151a23;--panel2:#1b222e;--line:#2b3544;--muted:#8591a4;--text:#e8edf5;--blue:#80a9ff;--red:#e68a96;--green:#8ed5ac;font:14px Inter,ui-sans-serif,system-ui,sans-serif}*{box-sizing:border-box}body{margin:0;height:100vh;overflow:hidden;background:var(--bg);color:var(--text)}button,input,textarea{font:inherit}button{cursor:pointer}.app{height:100%;display:grid;grid-template-columns:300px minmax(420px,1fr) 390px}.sidebar,.inspector{background:var(--panel);min-width:0}.sidebar{border-right:1px solid var(--line);display:flex;flex-direction:column}.inspector{border-left:1px solid var(--line);display:flex;flex-direction:column}.brand{padding:18px 16px 14px;border-bottom:1px solid var(--line)}.brand h1{margin:0;font-size:16px}.brand p{margin:7px 0 0;color:var(--muted);font-size:12px;line-height:1.45}.search{margin:12px;width:calc(100% - 24px);padding:9px 10px;background:#0f131b;border:1px solid var(--line);border-radius:6px;color:var(--text);outline:none}.search:focus,.input:focus,.editor:focus{border-color:var(--blue)}.session-list{overflow:auto}.session{padding:13px 16px;border-top:1px solid #202835;cursor:pointer}.session:hover,.session.active{background:var(--panel2)}.session-title{font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.session-meta{margin-top:5px;color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.main{min-width:0;display:grid;grid-template-rows:auto 1fr}.toolbar{display:flex;align-items:center;gap:8px;min-width:0;padding:11px 16px;border-bottom:1px solid var(--line);background:#11161f}.toolbar h2{margin:0;min-width:0;flex:1;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.mode{font-size:11px;padding:5px 7px;border:1px solid #5c6638;color:#c7db83;border-radius:5px;white-space:nowrap}.mode.source{border-color:#4b5a6c;color:#9cacbf}.button{border:1px solid #40516a;border-radius:6px;background:#243149;color:var(--text);padding:7px 10px}.button:hover{background:#2d3e5b}.button:disabled{opacity:.38;cursor:not-allowed}.button.danger{border-color:#75404b;background:#3a222a}.button.primary{border-color:#5079bc;background:#2a4b7d}.timeline{overflow:auto;padding:18px 20px}.message{max-width:920px;margin:0 auto 18px}.message-head{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:12px;margin-bottom:7px}.role{font-weight:700;color:var(--text);text-transform:uppercase;letter-spacing:.06em}.message-card{border:1px solid var(--line);border-radius:9px;background:var(--panel);overflow:hidden}.message-card.selected{border-color:var(--blue);box-shadow:0 0 0 1px #80a9ff33}.message-json{padding:11px 13px;color:#b9c4d4;white-space:pre-wrap;overflow:hidden;max-height:100px;font:12px ui-monospace,SFMono-Regular,monospace}.part{display:grid;grid-template-columns:112px minmax(0,1fr);gap:12px;padding:11px 13px;border-top:1px solid #27303d;cursor:pointer}.part:hover,.part.selected{background:#202a39}.part-label{font-size:12px;color:var(--blue);font-weight:650}.part-role{display:block;margin-top:4px;color:var(--muted);font-size:11px}.part-preview{color:#c7cfdb;white-space:pre-wrap;overflow:hidden;max-height:72px;font:12px ui-monospace,SFMono-Regular,monospace}.empty{padding:30px;color:var(--muted);text-align:center}.inspector-head{padding:14px 16px;border-bottom:1px solid var(--line)}.inspector-head h3{margin:0;font-size:14px}.inspector-head p{margin:6px 0 0;color:var(--muted);font-size:12px}.inspector-body{padding:14px 16px;overflow:auto;display:flex;flex-direction:column;gap:10px}.label{font-size:12px;color:var(--muted)}.input{width:100%;padding:8px 9px;background:#0e1219;color:var(--text);border:1px solid var(--line);border-radius:6px;outline:none}.editor{width:100%;min-height:300px;resize:vertical;background:#0e1219;color:#dce5f2;border:1px solid var(--line);border-radius:6px;padding:11px;font:12px/1.5 ui-monospace,SFMono-Regular,monospace;outline:none}.actions{display:flex;gap:7px;flex-wrap:wrap}.hint{font-size:12px;line-height:1.5;color:var(--muted);padding:10px;border:1px solid #293445;border-radius:6px;background:#111720}.warning{color:#e4c17c;border-color:#6d5831}.footer{padding:12px 16px;border-top:1px solid var(--line);display:flex;gap:7px;flex-wrap:wrap}.status{min-height:18px;color:var(--muted);font-size:12px;flex:1;width:100%}.status.error{color:var(--red)}.status.ok{color:var(--green)}@media(max-width:1000px){.app{grid-template-columns:250px minmax(360px,1fr)}.inspector{position:fixed;right:0;top:0;bottom:0;width:min(390px,90vw);transform:translateX(100%);transition:transform .18s;z-index:2;box-shadow:-15px 0 40px #0008}.inspector.open{transform:translateX(0)}}@media(max-width:650px){.app{display:block}.sidebar{height:35vh;border-right:0;border-bottom:1px solid var(--line)}.main{height:65vh}.toolbar{padding:9px}.timeline{padding:12px}.part{grid-template-columns:85px minmax(0,1fr)}}
  .app{min-height:0}.sidebar,.inspector{min-height:0}.session-list,.timeline,.inspector-body{min-height:0;scrollbar-width:none;-ms-overflow-style:none}.session-list::-webkit-scrollbar,.timeline::-webkit-scrollbar,.inspector-body::-webkit-scrollbar{display:none;width:0;height:0}.main{min-height:0;grid-template-rows:auto minmax(0,1fr)}.timeline{min-height:0;overflow-y:auto;overflow-x:hidden;contain:strict}.virtual-spacer{width:1px}.virtual-items{position:relative}.message-json{content-visibility:auto;contain-intrinsic-size:100px}.message{content-visibility:auto;contain-intrinsic-size:180px}
</style>
</head>
<body>
<div class="app">
<aside class="sidebar">
<div class="brand"><h1>OpenCode Session Editor</h1><p id="db"></p></div>
<input class="search" id="search" placeholder="Search sessions">
<div class="session-list" id="sessions"></div>
</aside>
<main class="main">
<div class="toolbar"><h2 id="sessionHeading">Select a session</h2><span class="mode source" id="mode">BROWSE</span><button class="button" id="editButton" disabled>Start editing</button><button class="button primary" id="applyButton" disabled>Apply</button><button class="button" id="undoButton" disabled>Undo</button><button class="button" id="redoButton" disabled>Redo</button><button class="button" id="inspectButton">Inspector</button></div>
<div class="timeline" id="timeline"><div class="empty">Select a session to inspect its messages, thinking traces, tool calls, and outputs.</div></div>
</main>
<aside class="inspector" id="inspector">
<div class="inspector-head"><h3 id="inspectorTitle">Inspector</h3><p id="inspectorMeta">Select a message or part.</p></div>
<div class="inspector-body">
<label class="label" for="sessionTitle">Session title</label><input class="input" id="sessionTitle" disabled>
<div class="actions"><button class="button" id="renameButton" disabled>Rename</button><button class="button" id="addMessageButton" disabled>Add message</button><button class="button" id="addPartButton" disabled>Add part</button></div>
<label class="label" for="editor">Raw JSON</label><textarea class="editor" id="editor" spellcheck="false" disabled></textarea>
<div class="hint" id="hint">Workspace edits are staged locally until Apply is confirmed. Source data is not changed while browsing.</div>
<div class="status" id="status"></div>
</div>
<div class="footer"><button class="button" id="saveButton" disabled>Save selected</button><button class="button danger" id="deleteButton" disabled>Delete selected</button></div>
</aside>
</div>
<script>
 const state={sessions:[],sessionId:'',document:null,editing:false,selection:null,virtual:{heights:[],estimate:220,raf:0,bound:false}};
const $=id=>document.getElementById(id);
const esc=value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const raw=value=>typeof value==='string'?value:JSON.stringify(value??{});
const messageRole=message=>{try{return JSON.parse(raw(message.data)).role||message.role||'message'}catch{return message.role||'message'}};
const partType=part=>{try{return JSON.parse(raw(part.data)).type||'unknown'}catch{return 'invalid'}};
const partPreview=part=>{try{const value=JSON.parse(raw(part.data));return value.text||value.tool||value.state?.title||value.state?.status||value.state?.output||partType(part)}catch{return 'invalid JSON'}};
async function request(url,options){const response=await fetch(url,options);const body=await response.json().catch(()=>({error:response.statusText}));if(!response.ok)throw new Error(body.error||response.statusText);return body}
async function loadSessions(){const body=await request('/api/sessions?q='+encodeURIComponent($('search').value));state.sessions=body.sessions||[];$('db').textContent=body.sessions?'Local OpenCode database':'Unavailable';$('sessions').innerHTML=state.sessions.map(s=>`<div class="session ${s.id===state.sessionId?'active':''}" data-session="${esc(s.id)}"><div class="session-title">${esc(s.title||s.id)}</div><div class="session-meta">${esc(s.directory)} · ${new Date(s.updated).toLocaleString()}</div></div>`).join('')||'<div class="empty">No sessions found</div>';document.querySelectorAll('[data-session]').forEach(node=>node.onclick=()=>loadSession(node.dataset.session))}
 async function loadSession(id){state.sessionId=id;state.editing=false;state.selection=null;state.virtual.heights=[];state.document=await request('/api/session?id='+encodeURIComponent(id));render();loadSessions()}
async function startEditing(){if(!state.sessionId)return;const body=await request('/api/workspace',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({sessionId:state.sessionId})});state.document=body.document;state.editing=true;setStatus('Workspace started','ok');render()}
function render(){const d=state.document;$('sessionHeading').textContent=d?.session?.title||'Select a session';$('mode').textContent=state.editing?'EDITING':'BROWSE';$('mode').className='mode '+(state.editing?'':'source');$('editButton').disabled=!d||state.editing;$('applyButton').disabled=!state.editing;$('undoButton').disabled=!state.editing;$('redoButton').disabled=!state.editing;$('sessionTitle').disabled=!state.editing;$('sessionTitle').value=d?.session?.title||'';$('renameButton').disabled=!state.editing;$('addMessageButton').disabled=!state.editing;$('addPartButton').disabled=!state.editing;renderTimeline();renderInspector()}
 function messageHTML(message){return `<section class="message" data-index="${state.document.messages.indexOf(message)}"><div class="message-head"><span class="role">${esc(messageRole(message))}</span><span>${esc(message.id)}</span></div><div class="message-card ${state.selection?.kind==='message'&&state.selection.id===message.id?'selected':''}" data-message="${esc(message.id)}"><pre class="message-json">${esc(prettyPreview(message.data,1600))}</pre>${message.parts.map(part=>`<div class="part ${state.selection?.kind==='part'&&state.selection.id===part.id?'selected':''}" data-part="${esc(part.id)}"><div><span class="part-label">${esc(partType(part))}</span><span class="part-role">${esc(messageRole(message))}</span></div><div class="part-preview">${esc(partPreview(part))}</div></div>`).join('')}</div></section>`}
 function renderTimeline(){const d=state.document;if(!d){$('timeline').innerHTML='<div class="empty">Select a session to inspect its messages, thinking traces, tool calls, and outputs.</div>';return}const count=d.messages.length;if(state.virtual.heights.length!==count)state.virtual.heights=Array.from({length:count},(_,i)=>state.virtual.heights[i]||state.virtual.estimate);const scrollTop=$('timeline').scrollTop;const viewport=$('timeline').clientHeight;const prefix=[0];for(let i=0;i<count;i++)prefix.push(prefix[i]+state.virtual.heights[i]);let start=0;while(start<count&&prefix[start+1]<scrollTop)start++;let end=start;while(end<count&&prefix[end]<scrollTop+viewport)end++;start=Math.max(0,start-3);end=Math.min(count,end+3);const visible=d.messages.slice(start,end);$('timeline').innerHTML=`<div class="virtual-spacer" style="height:${prefix[start]}px"></div><div class="virtual-items">${visible.map(messageHTML).join('')}</div><div class="virtual-spacer" style="height:${prefix[count]-prefix[end]}px"></div>`;const items=[...$('timeline').querySelectorAll('[data-index]')];items.forEach(node=>{const index=Number(node.dataset.index);const height=node.getBoundingClientRect().height;if(Math.abs(height-state.virtual.heights[index])>1){state.virtual.heights[index]=height;state.virtual.raf||=requestAnimationFrame(()=>{state.virtual.raf=0;renderTimeline()})}});if(!state.virtual.bound){$('timeline').addEventListener('scroll',()=>{if(!state.virtual.raf)state.virtual.raf=requestAnimationFrame(()=>{state.virtual.raf=0;renderTimeline()})},{passive:true});$('timeline').addEventListener('click',event=>{const part=event.target.closest('[data-part]');if(part){select('part',part.dataset.part);return}const message=event.target.closest('[data-message]');if(message)select('message',message.dataset.message)});state.virtual.bound=true}}
 function select(kind,id){state.selection={kind,id};renderTimeline();renderInspector()}
function selectedValue(){if(!state.document||!state.selection)return null;if(state.selection.kind==='message')return state.document.messages.find(value=>value.id===state.selection.id);for(const message of state.document.messages){const part=message.parts.find(value=>value.id===state.selection.id);if(part)return part}return null}
function renderInspector(){const value=selectedValue();$('inspectorTitle').textContent=value?(state.selection.kind==='message'?'Message':'Part'):'Inspector';$('inspectorMeta').textContent=value?value.id:'Select a message or part.';$('editor').disabled=!value||!state.editing;$('editor').value=value?pretty(value.data):'';$('saveButton').disabled=!value||!state.editing;$('deleteButton').disabled=!value||!state.editing;$('hint').textContent=value&&partType(value)==='reasoning'?'Reasoning may include provider signatures or encrypted metadata. Review validation before applying changes.':'Workspace edits are staged locally until Apply is confirmed. Source data is not changed while browsing.'}
async function change(operation,payload={}){try{const body=await request('/api/workspace/change',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({sessionId:state.sessionId,operation,...payload})});state.document=body.document;render();setStatus('Workspace updated','ok')}catch(error){setStatus(error.message,'error')}}
async function saveSelected(){const value=selectedValue();if(!value)return;let data;try{data=JSON.parse($('editor').value)}catch(error){setStatus('Invalid JSON: '+error.message,'error');return}await change(state.selection.kind==='message'?'message.update':'part.update',{messageId:state.selection.kind==='message'?value.id:undefined,partId:state.selection.kind==='part'?value.id:undefined,data})}
async function rename(){await change('session.rename',{title:$('sessionTitle').value})}
async function deleteSelected(){if(!state.selection||!confirm('Delete the selected record?'))return;await change(state.selection.kind==='message'?'message.delete':'part.delete',{messageId:state.selection.kind==='message'?state.selection.id:undefined,partId:state.selection.kind==='part'?state.selection.id:undefined});state.selection=null;render()}
async function addMessage(){const raw=prompt('Message JSON',JSON.stringify({role:'user',time:{created:Date.now()},agent:'build',model:{providerID:'',modelID:''}},null,2));if(raw===null)return;await change('message.add',{data:JSON.parse(raw)})}
async function addPart(){if(!state.selection||state.selection.kind!=='message'){setStatus('Select a message first','error');return}const raw=prompt('Part JSON',JSON.stringify({type:'text',text:''},null,2));if(raw===null)return;await change('part.add',{messageId:state.selection.id,data:JSON.parse(raw)})}
async function history(path){try{const body=await request('/api/workspace/'+path+'?sessionId='+encodeURIComponent(state.sessionId),{method:'POST'});state.document=body.document;render();setStatus(path==='undo'?'Undid last change':'Redid last change','ok')}catch(error){setStatus(error.message,'error')}}
async function apply(){if(!state.editing||!confirm('Apply staged changes to the OpenCode database? A backup will be created first.'))return;try{const body=await request('/api/apply?sessionId='+encodeURIComponent(state.sessionId),{method:'POST'});state.document=body.document;state.editing=false;render();setStatus('Applied. Backup: '+body.backup,'ok');loadSessions()}catch(error){setStatus(error.message,'error')}}
async function backup(){setStatus('Backups are created automatically during Apply','ok')}
 function pretty(value){try{return JSON.stringify(JSON.parse(raw(value)),null,2)}catch{return raw(value)}}
 function prettyPreview(value,limit){const text=pretty(value);return text.length>limit?text.slice(0,limit)+'\n...':' '+text.trimStart()}
function setStatus(text,kind=''){const node=$('status');node.textContent=text;node.className='status '+kind}
$('search').oninput=loadSessions;$('editButton').onclick=startEditing;$('saveButton').onclick=saveSelected;$('deleteButton').onclick=deleteSelected;$('renameButton').onclick=rename;$('addMessageButton').onclick=addMessage;$('addPartButton').onclick=addPart;$('undoButton').onclick=()=>history('undo');$('redoButton').onclick=()=>history('redo');$('applyButton').onclick=apply;$('inspectButton').onclick=()=>$('inspector').classList.toggle('open');loadSessions();
</script>
</body>
</html>
